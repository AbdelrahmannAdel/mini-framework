<!DOCTYPE html>
<html>
<body>
  <p id="count">Count: 0</p>
  <button id="btn">Add one</button>

  <script>
    let count = 0
    const p = document.getElementById("count")
    const btn = document.getElementById("btn")

    btn.addEventListener("click", function () {
      count = count + 1
      p.textContent = "Count: " + count
    })
  </script>
</body>
</html>
